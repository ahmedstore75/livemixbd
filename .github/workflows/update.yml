name: Auto Fetch and Update Toffee Playlists

on:
  schedule:
    # প্রতি ৬ ঘণ্টা পর পর এটি অটোমেটিক ব্যাকগ্রাউন্ডে চলবে (Cron Job)
    - cron: '0 */6 * * *'
  # গিটহাব ড্যাশবোর্ড থেকে ম্যানুয়ালি রান করার অপশন
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Fetch Script
        run: python fetch_data.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add toffee.m3u toffee.json
          git diff-index --quiet HEAD || git commit -m "Auto update Toffee M3U & JSON [skip ci]"
          git push
