name: Ayna OTT Playlist Generator

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run JavaScript Scraper
        run: node parse.js

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add ayna_ott.json ayna_ott.m3u
          git diff --staged --quiet || git commit -m "Auto updated Ayna OTT playlist: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
