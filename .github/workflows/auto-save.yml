name: Generate Accurate M3U and JSON Playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch API and Extract Channel Details
        run: |
          cat << 'EOF' > parse.js
          const fs = require("fs");
          const https = require("https");

          const urls = [
            "https://web.aynaott.com/live-tvs?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019dd930-8c78-702b-8c44-4cc1bf4b7bc7?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019efa5d-2eb7-7ac1-a880-647e38ba7141?_rsc=d6u12"
          ];

          const options = {
            headers: {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "RSC": "1",
              "Accept": "*/*"
            }
          };

          const fetchData = (url) => new Promise((resolve) => {
            https.get(url, options, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => resolve(data));
            }).on("error", () => resolve(""));
          });

          async function processData() {
            let rawData = "";
            for (const url of urls) {
              rawData += await fetchData(url) + "\n";
            }

            // Unescape Unicode & standard JSON escape sequences
            const cleanedData = rawData
              .replace(/\\"/g, '"')
              .replace(/\\\\/g, "\\")
              .replace(/\\u0026/g, "&");

            const channels = [];
            const seenUrls = new Set();
            let m3uContent = "#EXTM3U\n";

            // Extract valid JSON structures from Next.js payload lines
            const jsonObjects = [];
            const lines = cleanedData.split("\n");

            for (const line of lines) {
              const matches = line.match(/\{[^{}]*\}/g);
              if (matches) {
                for (const match of matches) {
                  try {
                    if (match.includes("http")) {
                      jsonObjects.push(match);
                    }
                  } catch (e) {}
                }
              }
            }

            // Regex scan across full payload blocks
            const streamMatches = [...cleanedData.matchAll(/(https?:[^\s"\\]+\.m3u8[^\s"\\]*)/gi)];

            const junkNames = [
              "viewport", "description", "Noir", "Default", "NEXT_LOCALE", "G", "Ayna OTT",
              "Email", "Phone number", "Subscriber ID", "Home", "Live TV", "Drama", "Movies",
              "Series", "Privacy Policy", "Terms of Service", "About Us", "Contact Us", "FAQ", "News",
              "Bangla", "Channels", "Channel", "Subscribe", "Football", "Cricket", "Sports"
            ];

            for (const match of streamMatches) {
              const streamUrl = match[1];

              // Filter out duplicate streams completely
              if (seenUrls.has(streamUrl)) continue;

              const startIndex = Math.max(0, match.index - 800);
              const endIndex = Math.min(cleanedData.length, match.index + 800);
              const context = cleanedData.substring(startIndex, endIndex);

              let channelName = "";
              let logoUrl = "";

              // Extract Name strictly from JSON attributes
              const titleMatches = [...context.matchAll(/"(?:title|name|channelName|tvName|label)"\s*:\s*"([^"]+)"/gi)];
              for (const tm of titleMatches) {
                const val = tm[1].trim();
                const isJunk = junkNames.includes(val);
                const isHash = /^[a-zA-Z0-9]{10,}$/.test(val); // Ignore raw hashes
                
                if (!isJunk && !isHash && val.length > 2) {
                  channelName = val;
                  break;
                }
              }

              // Extract Logo strictly from image properties
              const logoMatches = [...context.matchAll(/"(?:logo|image|poster|thumbnail|icon|src)"\s*:\s*"([^"]+\.(?:png|jpg|jpeg|webp)[^"]*)"/gi)];
              for (const lm of logoMatches) {
                const val = lm[1].trim();
                if (!val.includes("avatar") && !val.includes("default") && !val.includes("placeholder")) {
                  logoUrl = val;
                  break;
                }
              }

              // Direct image regex fallback in context
              if (!logoUrl) {
                const imgFallback = context.match(/(https?:[^\s"\\]+\.(?:png|jpg|jpeg|webp)[^\s"\\]*)/i);
                if (imgFallback && !imgFallback[1].includes("default")) {
                  logoUrl = imgFallback[1];
                }
              }

              // Skip entries without valid channel names or broken streams
              if (!channelName) continue;

              seenUrls.add(streamUrl);

              channels.push({
                name: channelName,
                logo: logoUrl,
                url: streamUrl
              });

              m3uContent += `#EXTINF:-1 tvg-name="${channelName}" tvg-logo="${logoUrl}", ${channelName}\n${streamUrl}\n`;
            }

            fs.writeFileSync("channels.json", JSON.stringify(channels, null, 2));
            fs.writeFileSync("playlist.m3u", m3uContent);
            console.log(`Successfully generated ${channels.length} valid named channels.`);
          }

          processData();
          EOF
          node parse.js

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.json playlist.m3u
          git diff --staged --quiet || git commit -m "Accurate Channel Name and Logo Parsing Fix: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
