name: Generate Accurate M3U and JSON Playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch API and Extract Channel Details
        run: |
          cat << 'EOF' > parse.js
          const fs = require("fs");
          const https = require("https");

          const urls = [
            "https://web.aynaott.com/live-tvs?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019dd930-8c78-702b-8c44-4cc1bf4b7bc7?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019efa5d-2eb7-7ac1-a880-647e38ba7141?_rsc=d6u12"
          ];

          const options = {
            headers: {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "RSC": "1",
              "Accept": "*/*"
            }
          };

          const fetchData = (url) => new Promise((resolve) => {
            https.get(url, options, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => resolve(data));
            }).on("error", () => resolve(""));
          });

          async function processData() {
            let rawData = "";
            for (const url of urls) {
              rawData += await fetchData(url) + "\n";
            }

            // Unescape Unicode & JSON strings properly
            const cleanedData = rawData
              .replace(/\\"/g, '"')
              .replace(/\\\\/g, "\\")
              .replace(/\\u0026/g, "&");

            const channels = [];
            const seenUrls = new Set();
            let m3uContent = "#EXTM3U\n";

            // Split into structural blocks/objects containing m3u8
            const rawBlocks = cleanedData.split(/(?=\{"id"|\{"title"|\{"name")/g);

            for (const block of rawBlocks) {
              if (!block.includes(".m3u8")) continue;

              // Extract Stream URL (.m3u8)
              const streamMatch = block.match(/(https?:[^\s"\\]+\.m3u8[^\s"\\]*)/i);
              if (!streamMatch) continue;

              const streamUrl = streamMatch[1];
              if (seenUrls.has(streamUrl)) continue;

              // Extract Name strictly within the same block
              let title = "";
              const titleMatch = block.match(/"(?:title|name|channelName|tvName|label)"\s*:\s*"([^"]+)"/i);
              
              if (titleMatch) {
                const val = titleMatch[1].trim();
                const junk = ["viewport", "description", "Noir", "Default", "NEXT_LOCALE", "G", "Ayna OTT", "Bangla", "Channels"];
                if (!junk.includes(val) && !/^[a-zA-Z0-9]{12,}$/.test(val)) {
                  title = val;
                }
              }

              // Extract Logo URL strictly within the same block
              let logoUrl = "";
              const logoMatch = block.match(/"(?:logo|image|poster|thumbnail|icon|src)"\s*:\s*"([^"]+\.(?:png|jpg|jpeg|webp)[^"]*)"/i) ||
                                block.match(/(https?:[^\s"\\]+\.(?:png|jpg|jpeg|webp)[^\s"\\]*)/i);

              if (logoMatch && !logoMatch[1].includes("avatar") && !logoMatch[1].includes("default")) {
                logoUrl = logoMatch[1];
              }

              // Skip if no proper title was found to prevent mismatching
              if (!title) continue;

              seenUrls.add(streamUrl);

              channels.push({
                name: title,
                logo: logoUrl,
                url: streamUrl
              });

              m3uContent += `#EXTINF:-1 tvg-name="${title}" tvg-logo="${logoUrl}", ${title}\n${streamUrl}\n`;
            }

            fs.writeFileSync("channels.json", JSON.stringify(channels, null, 2));
            fs.writeFileSync("playlist.m3u", m3uContent);
            console.log(`Successfully mapped ${channels.length} unique channels with logos.`);
          }

          processData();
          EOF
          node parse.js

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.json playlist.m3u
          git diff --staged --quiet || git commit -m "Fixed block matching for accurate logos and titles: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
