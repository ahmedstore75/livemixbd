name: Generate M3U and JSON Playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch API and Generate M3U/JSON
        run: |
          node -e '
          const fs = require("fs");
          const https = require("https");

          const urls = [
            "https://web.aynaott.com/live-tvs/blocks/019dd930-8c78-702b-8c44-4cc1bf4b7bc7?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019efa5d-2eb7-7ac1-a880-647e38ba7141?_rsc=d6u12"
          ];

          const options = {
            headers: {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "RSC": "1",
              "Accept": "*/*"
            }
          };

          const fetchData = (url) => new Promise((resolve) => {
            https.get(url, options, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => resolve(data));
            }).on("error", () => resolve(""));
          });

          async function process() {
            let combinedRaw = "";
            for (const url of urls) {
              combinedRaw += await fetchData(url) + "\n";
            }

            // Save Raw RSC JSON response
            fs.writeFileSync("channels.json", combinedRaw);

            // Extract stream URLs & titles for M3U format
            let m3uContent = "#EXTM3U\n";
            const streamMatches = [...combinedRaw.matchAll(/http[s]?:\/\/[^\s"\\]+\.m3u8[^\s"\\]*/g)];
            
            if (streamMatches.length > 0) {
              streamMatches.forEach((match, idx) => {
                m3uContent += `#EXTINF:-1 tvg-id="channel${idx+1}", Channel ${idx+1}\n${match[0]}\n`;
              });
            } else {
              m3uContent += "# No direct M3U8 streams found in raw data\n";
            }

            fs.writeFileSync("playlist.m3u", m3uContent);
          }

          process();
          '

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.json playlist.m3u
          git diff --staged --quiet || git commit -m "Auto-generate M3U and JSON playlist: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
