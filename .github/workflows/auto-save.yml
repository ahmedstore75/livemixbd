Name: Generate Detailed M3U and JSON Playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch API and Extract Channel Details
        run: |
          node -e '
          const fs = require("fs");
          const https = require("https");

          const urls = [
            "https://web.aynaott.com/live-tvs/blocks/019dd930-8c78-702b-8c44-4cc1bf4b7bc7?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019efa5d-2eb7-7ac1-a880-647e38ba7141?_rsc=d6u12"
          ];

          const options = {
            headers: {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "RSC": "1",
              "Accept": "*/*"
            }
          };

          const fetchData = (url) => new Promise((resolve) => {
            https.get(url, options, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => resolve(data));
            }).on("error", () => resolve(""));
          });

          async function process() {
            let combinedRaw = "";
            for (const url of urls) {
              combinedRaw += await fetchData(url) + "\n";
            }

            const channels = [];
            let m3uContent = "#EXTM3U\n";
            const seenUrls = new Set();

            // Regex for title, image, url matching
            const itemRegex = /"title":"([^"]+)".*?"image":\{"src":"([^"]+)".*?"url":"([^"]+)"/g;
            let match;

            while ((match = itemRegex.exec(combinedRaw)) !== null) {
              const title = match[1];
              const logo = match[2].replace(/\\/g, "");
              const streamUrl = match[3].replace(/\\/g, "");

              if (streamUrl && !seenUrls.has(streamUrl)) {
                seenUrls.add(streamUrl);
                channels.push({ title, logo, streamUrl });
                m3uContent += `#EXTINF:-1 tvg-name="${title}" tvg-logo="${logo}", ${title}\n${streamUrl}\n`;
              }
            }

            // Fallback: If primary regex finds 0 items, scan for raw m3u8 URLs
            if (channels.length === 0) {
              const streamMatches = [...combinedRaw.matchAll(/(https?:\\?\/\\?[^\s"\\]+\.m3u8[^\s"\\]*)/g)];
              const titleMatches = [...combinedRaw.matchAll(/"title":"([^"]+)"/g)];
              const imageMatches = [...combinedRaw.matchAll(/"src":"([^"]+\.(?:png|jpg|jpeg|webp)[^"]*)"/g)];

              streamMatches.forEach((st, idx) => {
                const streamUrl = st[1].replace(/\\/g, "");
                const title = titleMatches[idx] ? titleMatches[idx][1] : `Channel ${idx + 1}`;
                const logo = imageMatches[idx] ? imageMatches[idx][1].replace(/\\/g, "") : "";

                if (streamUrl && !seenUrls.has(streamUrl)) {
                  seenUrls.add(streamUrl);
                  channels.push({ title, logo, streamUrl });
                  m3uContent += `#EXTINF:-1 tvg-name="${title}" tvg-logo="${logo}", ${title}\n${streamUrl}\n`;
                }
              });
            }

            fs.writeFileSync("channels.json", JSON.stringify(channels, null, 2));
            fs.writeFileSync("playlist.m3u", m3uContent);
            console.log(`Successfully generated playlist with ${channels.length} unique channels.`);
          }

          process();
          '

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.json playlist.m3u
          git diff --staged --quiet || git commit -m "Updated M3U with Channel Names & Logos: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
