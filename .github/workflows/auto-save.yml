name: Generate Categorized M3U and JSON Playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: |
          npm init -y
          npm install puppeteer

      - name: Fetch API and Process Categories
        run: |
          cat << 'EOF' > parse.js
          const fs = require("fs");
          const puppeteer = require("puppeteer");

          const categoryOrder = [
            "Bangla", "Sports", "Kolkata", "Indian", "News", 
            "Movies", "Music", "Islamic", "Kids", "Documentary", "Entertainment"
          ];

          const priorityMap = {
            "Bangla": [
              "btv national", "btv", "channel i", "somoy tv", "jamuna tv", 
              "channel 24", "news 24", "news24", "atn news", "ntv", "rtv", 
              "ekushey tv", "etv", "independent tv", "bangla vision", 
              "atn bangla", "deepto tv", "ekattor tv", "dbc news", "gtv", 
              "gazi tv", "t sports", "maasranga tv", "ekhon tv", "bangla tv", 
              "ananda tv", "bijoy tv", "asian tv", "boishakhi", "desh tv", 
              "mohona", "nexus", "my tv", "sa tv", "channel 9", "channel 52",
              "drama 24", "global tv", "thikana"
            ],
            "Sports": [
              "t sports", "star sports 1", "star sports 2", "star sports hindi", 
              "sony sports 1", "sony sports 2", "sony sports 5", "ten sports", 
              "willow tv", "bein sports", "ptv sports", "eurosport"
            ]
          };

          function resolveCategory(title) {
            const clean = title.toLowerCase().trim();

            if (/btv|channel i|somoy|jamuna|channel 24|news 24|news24|atn news|ntv|rtv|ekushey|etv|independent|bangla vision|atn bangla|deepto|ekattor|dbc news|gtv|gazi tv|maasranga|ekhon|bangla tv|ananda tv|bijoy tv|asian tv|boishakhi|desh tv|mohona|nexus|my tv|sa tv|channel 9|channel 52|52|drama 24|global tv|thikana/i.test(clean)) {
              return "Bangla";
            }
            if (/kolkata|r plus|zee 24 ghanta|24 ghanta|sony aath|aath|jalsha|zee bangla|colors bangla|sangeet bangla|akash ath|ruposhi bangla|calcuttatv|enter 10 bangla|dd bangla|news18 bangla|tv9 bangla/i.test(clean)) {
              return "Kolkata";
            }
            if (/sport|tsn|espn|nfl|bein|cricket|football|willow|bleav|fifa|ten|eurosport|golf|sky|fishing|ktv/i.test(clean)) {
              return "Sports";
            }
            if (/star plus|zee tv|colors hindi|colors|sony tv|sab tv|star bharat|dangal|b4u|bindass|sahara|and pictures|&pictures|star gold|zee cinema|sony max|goldmine|tv9 bharatvarsh/i.test(clean)) {
              return "Indian";
            }
            if (/madani|islam|peace|makkah|madinah|quran|sunnah|iqra|deen|huda/i.test(clean)) {
              return "Islamic";
            }
            if (/news|samachar|khabar|bbc|cnn|jazeera|republic|ndtv|times|reuters|dw|cp24|fox news|business|aaj tak|bulletin|tv9/i.test(clean)) {
              return "News";
            }
            if (/movie|cinema|cine|gold|hbo|action|picture|filmy|flix|popcorn/i.test(clean)) {
              return "Movies";
            }
            if (/music|mtv|zoom|9xm|9x|sangeet|vh1|club|b4u hitz|zing|musiq|beat|sound/i.test(clean)) {
              return "Music";
            }
            if (/kid|cartoon|nick|pogo|disney|sonic|hungama|duronto|baby|junior|toon|anime/i.test(clean)) {
              return "Kids";
            }
            if (/discovery|nat geo|national geographic|history|animal planet|investigation|science|planet|earth|docu/i.test(clean)) {
              return "Documentary";
            }
            return "Entertainment";
          }

          function getPriorityIndex(category, title) {
            const list = priorityMap[category];
            if (!list) return 999;
            const clean = title.toLowerCase().trim();
            const index = list.findIndex(item => clean.includes(item));
            return index === -1 ? 999 : index;
          }

          async function processData() {
            const browser = await puppeteer.launch({
              headless: "new",
              args: ["--no-sandbox", "--disable-setuid-sandbox"]
            });
            const page = await browser.newPage();

            await page.setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");

            let rawResponses = [];

            // নেটওয়ার্ক ট্রাফিক ইন্টারসেপ্ট করে RSC এপিআই রেসপন্স ক্যাপচার
            page.on("response", async (response) => {
              const url = response.url();
              if (url.includes("live-tvs") || url.includes("blocks")) {
                try {
                  const text = await response.text();
                  rawResponses.push(text);
                } catch (e) {}
              }
            });

            console.log("Navigating to site...");
            await page.goto("https://web.aynaott.com/live-tvs", { waitUntil: "networkidle2", timeout: 60000 });

            // পেজের সব উপাদান রেন্ডার নিশ্চিত করতে স্ক্রোল ডিক্লেয়ারেশন
            await page.evaluate(async () => {
              await new Promise((resolve) => {
                let totalHeight = 0;
                const distance = 100;
                const timer = setInterval(() => {
                  const scrollHeight = document.body.scrollHeight;
                  window.scrollBy(0, distance);
                  totalHeight += distance;
                  if (totalHeight >= scrollHeight) {
                    clearInterval(timer);
                    resolve();
                  }
                }, 100);
              });
            });

            // DOM উপাদান থেকে সরাসরি নাম ও লোগো সংগ্রহ
            const domChannels = await page.evaluate(() => {
              const items = [];
              const cards = document.querySelectorAll("a, div[class*='card'], div[class*='item']");
              cards.forEach(card => {
                const img = card.querySelector("img");
                const text = card.innerText || img?.alt || "";
                if (img && img.src && text.length > 1 && text.length < 50) {
                  items.push({
                    name: text.trim().split("\n")[0],
                    logo: img.src
                  });
                }
              });
              return items;
            });

            const pageContent = await page.content();
            rawResponses.push(pageContent);
            await browser.close();

            const fullData = rawResponses.join("\n")
              .replace(/\\"/g, '"')
              .replace(/\\\\/g, "\\")
              .replace(/\\u0026/g, "&")
              .replace(/\\u002f/gi, "/");

            let extractedChannels = [];
            const seenUrls = new Set();

            const m3u8Regex = /(https?:[^\s"'\\]+\.m3u8[^\s"'\\]*)/gi;
            let match;

            while ((match = m3u8Regex.exec(fullData)) !== null) {
              const streamUrl = match[1];
              if (seenUrls.has(streamUrl)) continue;

              const startIndex = Math.max(0, match.index - 800);
              const endIndex = Math.min(fullData.length, match.index + 800);
              const contextBlock = fullData.substring(startIndex, endIndex);

              let title = "";
              const titleMatch = contextBlock.match(/"(?:title|name|channelName|tvName|label)"\s*:\s*"([^"]+)"/i);
              
              if (titleMatch) {
                let val = titleMatch[1].replace(/\\t|\\n|\\r/g, "").trim();
                const junk = ["viewport", "description", "Noir", "Default", "NEXT_LOCALE", "G", "Ayna OTT", "Bangla", "Channels", "Live-tvs"];
                if (val && !junk.includes(val) && !/^[a-f0-9-]{10,}$/i.test(val)) {
                  title = val;
                }
              }

              let logoUrl = "";
              const logoMatch = contextBlock.match(/"(?:logo|image|poster|thumbnail|icon|src)"\s*:\s*"([^"]+)"/i) ||
                                contextBlock.match(/(https?:[^\s"'\\]+\.(?:png|jpg|jpeg|webp)[^\s"'\\]*)/i);

              if (logoMatch) {
                let extracted = logoMatch[1].trim();
                if (extracted.startsWith("/")) {
                  extracted = "https://web.aynaott.com" + extracted;
                }
                if (!extracted.includes("avatar") && !extracted.includes("placeholder")) {
                  logoUrl = extracted;
                }
              }

              // DOM থেকে ম্যাচ করা
              if (!title || title.startsWith("Channel")) {
                const matchedDom = domChannels.find(d => logoUrl && d.logo && d.logo.includes(logoUrl.split('/').pop()));
                if (matchedDom) {
                  title = matchedDom.name;
                  if (!logoUrl) logoUrl = matchedDom.logo;
                }
              }

              if (!title) {
                title = `Channel ${extractedChannels.length + 1}`;
              }

              const category = resolveCategory(title);
              seenUrls.add(streamUrl);

              extractedChannels.push({
                name: title,
                logo: logoUrl || "https://raw.githubusercontent.com/iptv-org/iptv/master/logos/IPTV.png",
                url: streamUrl,
                category: category,
                priority: getPriorityIndex(category, title)
              });
            }

            extractedChannels.sort((a, b) => {
              const catIndexA = categoryOrder.indexOf(a.category);
              const catIndexB = categoryOrder.indexOf(b.category);

              const indexA = catIndexA === -1 ? 99 : catIndexA;
              const indexB = catIndexB === -1 ? 99 : catIndexB;

              if (indexA !== indexB) return indexA - indexB;
              if (a.priority !== b.priority) return a.priority - b.priority;
              return a.name.localeCompare(b.name);
            });

            console.log(`Total channels fetched: ${extractedChannels.length}`);

            let m3uContent = "#EXTM3U\n";
            for (const ch of extractedChannels) {
              m3uContent += `#EXTINF:-1 group-title="${ch.category}" tvg-name="${ch.name}" tvg-logo="${ch.logo}", ${ch.name}\n${ch.url}\n`;
            }

            fs.writeFileSync("channels.json", JSON.stringify(extractedChannels, null, 2));
            fs.writeFileSync("playlist.m3u", m3uContent);
          }

          processData();
          EOF
          node parse.js

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.json playlist.m3u
          git diff --staged --quiet || git commit -m "Updated channels with Puppeteer: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
