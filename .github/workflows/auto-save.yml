name: Generate Accurate M3U and JSON Playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch API and Extract Channel Details
        run: |
          cat << 'EOF' > parse.js
          const fs = require("fs");
          const https = require("https");

          const urls = [
            "https://web.aynaott.com/live-tvs?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019dd930-8c78-702b-8c44-4cc1bf4b7bc7?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019efa5d-2eb7-7ac1-a880-647e38ba7141?_rsc=d6u12"
          ];

          const options = {
            headers: {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "RSC": "1",
              "Accept": "*/*"
            }
          };

          const fetchData = (url) => new Promise((resolve) => {
            https.get(url, options, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => resolve(data));
            }).on("error", () => resolve(""));
          });

          function cleanChannelName(slug) {
            if (!slug) return "";
            // Replace hyphens, underscores and capitalize words
            let name = slug.replace(/[-_]/g, " ")
                           .replace(/index/gi, "")
                           .replace(/hls/gi, "")
                           .replace(/stream/gi, "")
                           .trim();

            if (!name) return "";

            // Capitalize properly (e.g. banglatv -> Bangla Tv)
            return name.replace(/\b\w/g, l => l.toUpperCase());
          }

          async function processData() {
            let rawData = "";
            for (const url of urls) {
              rawData += await fetchData(url) + "\n";
            }

            // Unescape Unicode & standard JSON escape sequences
            const cleanedData = rawData
              .replace(/\\"/g, '"')
              .replace(/\\\\/g, "\\")
              .replace(/\\u0026/g, "&");

            const channels = [];
            const seenUrls = new Set();
            let m3uContent = "#EXTM3U\n";

            // Find all m3u8 stream links
            const streamMatches = [...cleanedData.matchAll(/(https?:[^\s"\\]+\.m3u8[^\s"\\]*)/gi)];

            for (const match of streamMatches) {
              const streamUrl = match[1];

              // Filter out duplicate streams
              if (seenUrls.has(streamUrl)) continue;

              const startIndex = Math.max(0, match.index - 400);
              const endIndex = Math.min(cleanedData.length, match.index + 400);
              const context = cleanedData.substring(startIndex, endIndex);

              // 1. Try JSON metadata extraction for Title
              let channelName = "";
              const titleMatch = context.match(/"(?:title|name|channelName|tvName)"\s*:\s*"([^"]+)"/i);
              
              const junkTitles = [
                "viewport", "description", "Noir", "Default", "NEXT_LOCALE", "G", "Ayna OTT",
                "Email", "Phone number", "Subscriber ID", "Home", "Live TV", "Drama", "Movies",
                "Series", "Privacy Policy", "Terms of Service", "About Us", "Contact Us", "FAQ", "News"
              ];

              if (titleMatch && !junkTitles.includes(titleMatch[1].trim())) {
                channelName = titleMatch[1].trim();
              }

              // 2. Fallback: Parse Title directly from Stream URL Path
              if (!channelName) {
                try {
                  const parsedUrl = new URL(streamUrl);
                  const pathSegments = parsedUrl.pathname.split("/").filter(Boolean);
                  if (pathSegments.length > 0) {
                    const lastSegment = pathSegments[0] !== "hls" ? pathSegments[0] : pathSegments[1];
                    channelName = cleanChannelName(lastSegment);
                  }
                } catch (e) {}
              }

              if (!channelName) channelName = `Channel ${channels.length + 1}`;

              // 3. Extract Logo URL from context or API
              let logoUrl = "";
              const logoMatch = context.match(/(https?:[^\s"\\]+\.(?:png|jpg|jpeg|webp)[^\s"\\]*)/i);
              
              if (logoMatch) {
                logoUrl = logoMatch[1];
              }

              seenUrls.add(streamUrl);

              channels.push({
                name: channelName,
                logo: logoUrl,
                url: streamUrl
              });

              m3uContent += `#EXTINF:-1 tvg-name="${channelName}" tvg-logo="${logoUrl}", ${channelName}\n${streamUrl}\n`;
            }

            fs.writeFileSync("channels.json", JSON.stringify(channels, null, 2));
            fs.writeFileSync("playlist.m3u", m3uContent);
            console.log(`Successfully generated ${channels.length} channels.`);
          }

          processData();
          EOF
          node parse.js

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.json playlist.m3u
          git diff --staged --quiet || git commit -m "Fixed Channel Names and Logo extraction: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
