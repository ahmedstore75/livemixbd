Name: Generate M3U and JSON Playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch API and Process Categories
        run: |
          cat << 'EOF' > parse.js
          const fs = require("fs");
          const https = require("https");

          const urls = [
            "https://web.aynaott.com/live-tvs?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019dd930-8c78-702b-8c44-4cc1bf4b7bc7?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019efa5d-2eb7-7ac1-a880-647e38ba7141?_rsc=d6u12"
          ];

          const options = {
            headers: {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "RSC": "1",
              "Accept": "*/*"
            }
          };

          const fetchData = (url) => new Promise((resolve) => {
            https.get(url, options, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => resolve(data));
            }).on("error", () => resolve(""));
          });

          // Master Category Order
          const categoryOrder = [
            "Bangla", 
            "Sports", 
            "Kolkata", 
            "Indian", 
            "News", 
            "Movies", 
            "Music", 
            "Islamic", 
            "Kids", 
            "Documentary", 
            "Entertainment"
          ];

          // BD Popular Channel List (Top Priority First)
          const bdChannelPriority = [
            "somoy tv", "jamuna tv", "independent tv", "channel 24", "ekattor tv", 
            "dbc news", "news 24 bd", "atn news", "ekhon tv", "btv national hd", 
            "btv", "btv world", "btv ctg", "channel i", "ntv", "bangla vision", 
            "rtv", "atn bangla", "etv", "maasranga tv", "deepto tv", "gazi tv", 
            "gtv", "asian tv", "duronto tv", "sa tv", "channel 9", "mohona tv", 
            "nexus tv", "bijoy tv", "global tv", "my tv", "ananda tv", "desh tv", "boishakhi tv"
          ];

          // Kolkata Popular Channel List
          const kolkataChannelPriority = [
            "zee bangla", "star jalsha", "jalsha", "colors bangla", "sony aath", 
            "aath", "sangeet bangla", "akash ath", "ruposhi bangla", "calcuttatv", 
            "enter 10 bangla", "dd bangla", "news18 bangla", "tv9 bangla", "bangla talkies"
          ];

          function getPriorityIndex(title, priorityList) {
            const clean = title.toLowerCase().trim();
            const index = priorityList.findIndex(item => clean.includes(item));
            return index === -1 ? 999 : index;
          }

          function resolveCategory(title) {
            const clean = title.toLowerCase().trim();

            // 1. Kolkata
            if (/sony aath|aath|jalsha|zee bangla|colors bangla|sangeet bangla|akash ath|ruposhi bangla|calcuttatv|enter 10 bangla|dd bangla|news18 bangla|tv9 bangla|bangla talkies/i.test(clean)) {
              return "Kolkata";
            }

            // 2. Bangla (BD Channels)
            if (bdChannelPriority.some(item => clean.includes(item)) || /bangla|bd|dhaka|nagorik|bangladesh/i.test(clean)) {
              return "Bangla";
            }

            // 3. Sports
            if (/sport|tsn|espn|nfl|bein|cricket|football|willow|bleav|fifa|ten|eurosport|golf|sky|t sports/i.test(clean)) {
              return "Sports";
            }

            // 4. Indian (Hindi)
            if (/star plus|zee tv|colors hindi|colors|sony tv|sab tv|star bharat|dangal|b4u|bindass|sahara|and pictures|&pictures|star gold|zee cinema|sony max|goldmine/i.test(clean)) {
              return "Indian";
            }

            // 5. Islamic
            if (/madani|islam|peace|makkah|madinah|quran|sunnah|iqra|deen|huda/i.test(clean)) {
              return "Islamic";
            }

            // 6. News
            if (/news|samachar|khabar|bbc|cnn|jazeera|republic|ndtv|times|reuters|dw|cp24|fox news|business|aaj tak|bulletin|tv9|anb|bharat/i.test(clean)) {
              return "News";
            }

            // 7. Movies
            if (/movie|cinema|cine|gold|hbo|action|picture|filmy|flix|popcorn/i.test(clean)) {
              return "Movies";
            }

            // 8. Music
            if (/music|mtv|zoom|9xm|9x|sangeet|vh1|club|b4u hitz|zing|musiq|beat|sound/i.test(clean)) {
              return "Music";
            }

            // 9. Kids
            if (/kid|cartoon|nick|pogo|disney|sonic|hungama|duronto|baby|junior|toon|anime/i.test(clean)) {
              return "Kids";
            }

            // 10. Documentary
            if (/discovery|nat geo|national geographic|history|animal planet|investigation|science|planet|earth|docu/i.test(clean)) {
              return "Documentary";
            }

            return "Entertainment";
          }

          async function processData() {
            let rawData = "";
            for (const url of urls) {
              const res = await fetchData(url);
              if (res) rawData += res + "\n";
            }

            const cleanedData = rawData
              .replace(/\\"/g, '"')
              .replace(/\\\\/g, "\\")
              .replace(/\\u0026/g, "&");

            let extractedChannels = [];
            const seenUrls = new Set();

            const rawBlocks = cleanedData.split(/(?=\{"id"|\{"title"|\{"name")/g);

            for (const block of rawBlocks) {
              if (!block.includes(".m3u8")) continue;

              const streamMatch = block.match(/(https?:[^\s"\\]+\.m3u8[^\s"\\]*)/i);
              if (!streamMatch) continue;

              const streamUrl = streamMatch[1];
              if (seenUrls.has(streamUrl)) continue;

              let title = "";
              const titleMatch = block.match(/"(?:title|name|channelName|tvName|label)"\s*:\s*"([^"]+)"/i);
              
              if (titleMatch) {
                let val = titleMatch[1].replace(/\\t|\\n|\\r/g, "").trim();
                const junk = ["viewport", "description", "Noir", "Default", "NEXT_LOCALE", "G", "Ayna OTT", "Bangla", "Channels", "Live-tvs"];
                if (!junk.includes(val) && !/^[a-zA-Z0-9]{12,}$/.test(val)) {
                  title = val;
                }
              }

              if (!title) continue;

              let logoUrl = "";
              const logoMatch = block.match(/"(?:logo|image|poster|thumbnail|icon|src)"\s*:\s*"([^"]+)"/i) ||
                                block.match(/(\/storage\/[^\s"\\]+\.(?:png|jpg|jpeg|webp))/i) ||
                                block.match(/(https?:[^\s"\\]+\.(?:png|jpg|jpeg|webp)[^\s"\\]*)/i);

              if (logoMatch) {
                let extracted = logoMatch[1].trim();
                if (extracted.startsWith("/")) {
                  extracted = "https://web.aynaott.com" + extracted;
                }
                if (!extracted.includes("avatar") && !extracted.includes("default")) {
                  logoUrl = extracted;
                }
              }

              const category = resolveCategory(title);
              seenUrls.add(streamUrl);

              extractedChannels.push({
                name: title,
                logo: logoUrl,
                url: streamUrl,
                category: category
              });
            }

            // Strict Priority Sorting
            extractedChannels.sort((a, b) => {
              const catIndexA = categoryOrder.indexOf(a.category);
              const catIndexB = categoryOrder.indexOf(b.category);

              const indexA = catIndexA === -1 ? 99 : catIndexA;
              const indexB = catIndexB === -1 ? 99 : catIndexB;

              if (indexA !== indexB) {
                return indexA - indexB;
              }

              if (a.category === "Bangla") {
                const pA = getPriorityIndex(a.name, bdChannelPriority);
                const pB = getPriorityIndex(b.name, bdChannelPriority);
                if (pA !== pB) return pA - pB;
              } 
              else if (a.category === "Kolkata") {
                const pA = getPriorityIndex(a.name, kolkataChannelPriority);
                const pB = getPriorityIndex(b.name, kolkataChannelPriority);
                if (pA !== pB) return pA - pB;
              }

              return a.name.localeCompare(b.name);
            });

            let m3uContent = "#EXTM3U\n";
            for (const ch of extractedChannels) {
              m3uContent += `#EXTINF:-1 group-title="${ch.category}" tvg-name="${ch.name}" tvg-logo="${ch.logo}", ${ch.name}\n${ch.url}\n`;
            }

            fs.writeFileSync("channels.json", JSON.stringify(extractedChannels, null, 2));
            fs.writeFileSync("playlist.m3u", m3uContent);
            console.log("Successfully generated playlist.m3u and channels.json");
          }

          processData();
          EOF
          node parse.js

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.json playlist.m3u
          git diff --staged --quiet || git commit -m "Auto-update playlist: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
