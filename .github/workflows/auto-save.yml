name: Generate Accurate M3U and JSON Playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch API and Extract Channel Details
        run: |
          cat << 'EOF' > parse.js
          const fs = require("fs");
          const https = require("https");

          const urls = [
            "https://web.aynaott.com/live-tvs/blocks/019dd930-8c78-702b-8c44-4cc1bf4b7bc7?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019efa5d-2eb7-7ac1-a880-647e38ba7141?_rsc=d6u12"
          ];

          const options = {
            headers: {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "RSC": "1",
              "Accept": "*/*"
            }
          };

          const fetchData = (url) => new Promise((resolve) => {
            https.get(url, options, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => resolve(data));
            }).on("error", () => resolve(""));
          });

          async function processData() {
            let rawData = "";
            for (const url of urls) {
              rawData += await fetchData(url) + "\n";
            }

            const channels = [];
            const seenUrls = new Set();
            let m3uContent = "#EXTM3U\n";

            // RSC lines clean & unescape
            const lines = rawData.split("\n");

            for (let line of lines) {
              if (!line.includes(".m3u8")) continue;

              // Clean escaped JSON strings in RSC format
              let cleanedLine = line.replace(/\\"/g, '"').replace(/\\\\/g, "\\");

              // Match JSON object or chunk containing stream URL
              const jsonMatches = cleanedLine.match(/\{[^{}]*"(?:streamUrl|url|file|src|link)"\s*:\s*"[^"]+\.m3u8[^"]*"[^{}]*\}/g) || 
                                cleanedLine.match(/\{[^{}]*\.m3u8[^{}]*\}/g);

              const targets = jsonMatches || [cleanedLine];

              for (let block of targets) {
                // Extract Stream URL (.m3u8)
                const urlMatch = block.match(/(https?:[^\s"\\]+\.m3u8[^\s"\\]*)/);
                if (!urlMatch) continue;

                const streamUrl = urlMatch[1];

                // Skip duplicate links
                if (seenUrls.has(streamUrl)) continue;

                // Extract Channel Title (Searching strictly within the same block)
                const titleMatch = block.match(/"(?:title|name|channelName|label|tvName)"\s*:\s*"([^"]+)"/i);
                let title = titleMatch ? titleMatch[1].trim() : "";

                // Skip site menu items or boilerplate metadata
                const junkTitles = [
                  "viewport", "description", "Noir", "Default", "NEXT_LOCALE", "G", "Ayna OTT",
                  "Email", "Phone number", "Subscriber ID", "Home", "Live TV", "Drama", "Movies",
                  "Series", "Privacy Policy", "Terms of Service", "About Us", "Contact Us", "FAQ", "News"
                ];

                if (!title || junkTitles.includes(title)) {
                  // Fallback: search nearby text inside block for channel title
                  const fallbackTitleMatch = block.match(/"text"\s*:\s*"([^"]+)"/i);
                  if (fallbackTitleMatch && !junkTitles.includes(fallbackTitleMatch[1])) {
                    title = fallbackTitleMatch[1].trim();
                  } else {
                    title = `Channel ${channels.length + 1}`;
                  }
                }

                // Extract Logo URL
                const logoMatch = block.match(/"(?:logo|image|thumbnail|poster|icon|src)"\s*:\s*"([^"]+\.(?:png|jpg|jpeg|webp)[^"]*)"/i) ||
                                  block.match(/(https?:[^\s"\\]+\.(?:png|jpg|jpeg|webp)[^\s"\\]*)/i);
                
                const logo = logoMatch ? logoMatch[1] : "";

                seenUrls.add(streamUrl);

                channels.push({
                  name: title,
                  logo: logo,
                  url: streamUrl
                });

                m3uContent += `#EXTINF:-1 tvg-name="${title}" tvg-logo="${logo}", ${title}\n${streamUrl}\n`;
              }
            }

            fs.writeFileSync("channels.json", JSON.stringify(channels, null, 2));
            fs.writeFileSync("playlist.m3u", m3uContent);
            console.log(`Successfully generated ${channels.length} unique channels.`);
          }

          processData();
          EOF
          node parse.js

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.json playlist.m3u
          git diff --staged --quiet || git commit -m "Fixed metadata matching & excluded UI elements: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
