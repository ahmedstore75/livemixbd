name: Auto Fetch Live TV Data

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর নিজে থেকেই ডাটা আপডেট হবে
  workflow_dispatch: # আপনি চাইলে অ্যাকশন ট্যাব থেকে ম্যানুয়ালিও রান করতে পারবেন

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # এপিআই থেকে ডাটা ডাউনলোড করে data.json এবং data2.json ফাইলে সেভ করবে
      - name: Fetch API Data
        run: |
          curl -s "https://web.aynaott.com/live-tvs/blocks/019dd930-8c78-702b-8c44-4cc1bf4b7bc7?_rsc=d6u12" -o data.json
          curl -s "https://web.aynaott.com/live-tvs/blocks/019efa5d-2eb7-7ac1-a880-647e38ba7141?_rsc=d6u12" -o data2.json

      # নতুন ফাইল দুটি গিটহাবে সেভ ও পুশ করবে
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data.json data2.json
          git diff --staged --quiet || git commit -m "Auto-update TV data: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
