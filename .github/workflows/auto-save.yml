name: Auto Save Data

on:
  push:
    branches:
      - main  # আপনার মূল ব্রাঞ্চ যদি 'master' হয়, তবে 'main' কেটে 'master' লিখবেন
  schedule:
    - cron: '0 */6 * * *'  # প্রতি ৬ ঘণ্টা পর পর এটি স্বয়ংক্রিয়ভাবে রান হবে

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # পুশ করার পারমিশন নিশ্চিত করতে

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git configuration
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Check and commit changes
        run: |
          git status
          git add .
          git diff --staged --quiet || git commit -m "Auto-save data: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
