name: Generate Categorized M3U and JSON Playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch API and Process Categories
        run: |
          cat << 'EOF' > parse.js
          const fs = require("fs");
          const https = require("https");

          const urls = [
            "https://web.aynaott.com/live-tvs?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019dd930-8c78-702b-8c44-4cc1bf4b7bc7?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019efa5d-2eb7-7ac1-a880-647e38ba7141?_rsc=d6u12"
          ];

          const options = {
            headers: {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "RSC": "1",
              "Accept": "*/*"
            }
          };

          const fetchData = (url) => new Promise((resolve) => {
            https.get(url, options, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => resolve(data));
            }).on("error", () => resolve(""));
          });

          // Priority Bangladeshi List
          const bdChannelPriority = [
            "btv national hd", "btv", "btv world", "btv ctg", "somoy tv",
            "channel i", "ntv", "bangla vision", "rtv", "atn bangla", 
            "etv", "maasranga tv", "deepto tv", "ekhon tv", "ekattor tv", 
            "jamuna tv", "news 24 bd", "channel 24", "dbc news", "atn news", 
            "independent tv", "gazi tv", "channel 9", "sa tv", "bangla tv", 
            "mohona tv", "nexus tv", "bijoy tv", "global tv", "my tv", 
            "ananda tv", "desh tv", "boishakhi tv", "asian tv", "duronto tv"
          ];

          // Regex Match Patterns for Smart Classification
          const rules = [
            { category: "Bangladeshi", regex: /\b(btv|somoy|channel\s*i|ntv|banglavision|rtv|atn|etv|maasranga|deepto|ekhon|ekattor|jamuna|dbc|gazi|gtv|independent|mohona|nexus|bijoy|global\s*tv|my\s*tv|ananda|desh\s*tv|boishakhi|asian\s*tv)\b/i },
            { category: "Indian Bangla", regex: /\b(sony\s*aath|aath|jalsha|zee\s*bangla|colors\s*bangla|sangeet\s*bangla|akash\s*ath|ruposhi\s*bangla|calcuttatv|enter\0\s*bangla|bangla)\b/i },
            { category: "Islamic", regex: /\b(islamic|madani|peace\s*tv|makkah|madinah|quran|sunnah|iqra|deen|huda|guide\s*us)\b/i },
            { category: "Sports", regex: /\b(sport|sports|t\s*sports|tsn|espn|nfl|bein|cricket|football|willow|ptv\s*sports|bleav|fifa|ten\s*sports|eurosport|golf|sky\s*sports|star\s*sports)\b/i },
            { category: "News", regex: /\b(news|samachar|khabar|bbc|cnn|al\s*jazeera|republic|ndtv|times\s*now|reuters|dw|cp\s*24|fox\s*news|fox\s*business|aaj\s*tak|bulletin|tv9|anb|bharat)\b/i },
            { category: "Movies", regex: /\b(movie|movies|cinema|cine|gold|max|hbo|action|goldmine|pictures|&pictures|filmy|flix|popcorn|star\s*gold|zee\s*cinema|sony\s*max)\b/i },
            { category: "Music", regex: /\b(music|m\s*tv|mtv|zoom|9xm|9x|sangeet|vh1|club|b4u\s*hitz|zing|musiq|beats|sound)\b/i },
            { category: "Kids", regex: /\b(kids|cartoon|nick|pogo|disney|sonic|hungama|duronto|baby|junior|toon|anime)\b/i },
            { category: "Documentary", regex: /\b(discovery|nat\s*geo|national\s*geographic|history|animal\s*planet|investigation|science|planet|earth|docu)\b/i },
            { category: "Hindi", regex: /\b(star\s*plus|zee\s*tv|colors|sony\s*tv|sab|star\s*bharat|dangal|b4u|bindass|sahara)\b/i },
            { category: "Entertainment", regex: /\b(entertainment|usa|fox|drama|series|shows|tv|channel)\b/i }
          ];

          const categoryOrder = [
            "Bangladeshi", 
            "Indian Bangla", 
            "Sports", 
            "News",
            "Movies", 
            "Music", 
            "Hindi", 
            "Islamic", 
            "Kids", 
            "Documentary", 
            "Entertainment", 
            "Others"
          ];

          async function processData() {
            let rawData = "";
            for (const url of urls) {
              rawData += await fetchData(url) + "\n";
            }

            const cleanedData = rawData
              .replace(/\\"/g, '"')
              .replace(/\\\\/g, "\\")
              .replace(/\\u0026/g, "&");

            let extractedChannels = [];
            const seenUrls = new Set();

            const rawBlocks = cleanedData.split(/(?=\{"id"|\{"title"|\{"name")/g);

            for (const block of rawBlocks) {
              if (!block.includes(".m3u8")) continue;

              const streamMatch = block.match(/(https?:[^\s"\\]+\.m3u8[^\s"\\]*)/i);
              if (!streamMatch) continue;

              const streamUrl = streamMatch[1];
              if (seenUrls.has(streamUrl)) continue;

              let title = "";
              const titleMatch = block.match(/"(?:title|name|channelName|tvName|label)"\s*:\s*"([^"]+)"/i);
              
              if (titleMatch) {
                let val = titleMatch[1];
                val = val.replace(/\\t|\\n|\\r/g, "").trim();
                const junk = ["viewport", "description", "Noir", "Default", "NEXT_LOCALE", "G", "Ayna OTT", "Bangla", "Channels"];
                if (!junk.includes(val) && !/^[a-zA-Z0-9]{12,}$/.test(val)) {
                  title = val;
                }
              }

              if (!title) continue;

              let logoUrl = "";
              const logoMatch = block.match(/"(?:logo|image|poster|thumbnail|icon|src)"\s*:\s*"([^"]+)"/i) ||
                                block.match(/(\/storage\/[^\s"\\]+\.(?:png|jpg|jpeg|webp))/i) ||
                                block.match(/(https?:[^\s"\\]+\.(?:png|jpg|jpeg|webp)[^\s"\\]*)/i);

              if (logoMatch) {
                let extracted = logoMatch[1].trim();
                if (extracted.startsWith("/")) {
                  extracted = "https://web.aynaott.com" + extracted;
                }
                if (!extracted.includes("avatar") && !extracted.includes("default")) {
                  logoUrl = extracted;
                }
              }

              const lowerTitle = title.toLowerCase();

              // Advanced Smart Categorization Match
              let category = "Others";
              
              if (bdChannelPriority.some(item => lowerTitle === item || lowerTitle.includes(item))) {
                category = "Bangladeshi";
              } else {
                for (const rule of rules) {
                  if (rule.regex.test(lowerTitle)) {
                    category = rule.category;
                    break;
                  }
                }
              }

              seenUrls.add(streamUrl);

              extractedChannels.push({
                name: title,
                logo: logoUrl,
                url: streamUrl,
                category: category
              });
            }

            // Category Sorting
            extractedChannels.sort((a, b) => {
              const catIndexA = categoryOrder.indexOf(a.category);
              const catIndexB = categoryOrder.indexOf(b.category);

              if (catIndexA !== catIndexB) {
                return catIndexA - catIndexB;
              }

              if (a.category === "Bangladeshi") {
                const nameA = a.name.toLowerCase();
                const nameB = b.name.toLowerCase();
                const indexA = bdChannelPriority.findIndex(item => nameA.includes(item));
                const indexB = bdChannelPriority.findIndex(item => nameB.includes(item));

                if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                if (indexA !== -1) return -1;
                if (indexB !== -1) return 1;
              }

              return a.name.localeCompare(b.name);
            });

            let m3uContent = "#EXTM3U\n";
            for (const ch of extractedChannels) {
              m3uContent += `#EXTINF:-1 group-title="${ch.category}" tvg-name="${ch.name}" tvg-logo="${ch.logo}", ${ch.name}\n${ch.url}\n`;
            }

            fs.writeFileSync("channels.json", JSON.stringify(extractedChannels, null, 2));
            fs.writeFileSync("playlist.m3u", m3uContent);
            console.log(`Smart Regex Classifier applied. Categories updated successfully.`);
          }

          processData();
          EOF
          node parse.js

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.json playlist.m3u
          git diff --staged --quiet || git commit -m "Applied Regex Matcher to eliminate Others category overflow: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
