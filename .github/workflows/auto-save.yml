name: Generate Accurate M3U and JSON Playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch API and Extract Channel Details
        run: |
          cat << 'EOF' > parse.js
          const fs = require("fs");
          const https = require("https");

          const urls = [
            "https://web.aynaott.com/live-tvs?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019dd930-8c78-702b-8c44-4cc1bf4b7bc7?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019efa5d-2eb7-7ac1-a880-647e38ba7141?_rsc=d6u12"
          ];

          const options = {
            headers: {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "RSC": "1",
              "Accept": "*/*"
            }
          };

          const fetchData = (url) => new Promise((resolve) => {
            https.get(url, options, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => resolve(data));
            }).on("error", () => resolve(""));
          });

          // Helper to infer proper TV Channel Name from Stream URL
          function deriveNameFromUrl(url) {
            try {
              const parsed = new URL(url);
              const pathSegments = parsed.pathname.split('/').filter(Boolean);
              
              // Find the segment containing channel slug
              let slug = pathSegments.find(s => !['hls', 'live', 'index.m3u8', 'playlist.m3u8', 'stream'].includes(s.toLowerCase())) || "";
              slug = slug.replace(/\.m3u8$/i, "");

              if (!slug) return "";

              // Formatting name nicely
              let name = slug
                .replace(/[-_]/g, " ")
                .replace(/\b(tv|bd|hd|stream|hls)\b/gi, "")
                .trim();

              if (!name) name = slug;

              // Title Case Formatting
              return name.replace(/\b\w/g, c => c.toUpperCase());
            } catch (e) {
              return "";
            }
          }

          async function processData() {
            let rawData = "";
            for (const url of urls) {
              rawData += await fetchData(url) + "\n";
            }

            // Unescape JSON text strings from RSC output
            const cleanedData = rawData
              .replace(/\\"/g, '"')
              .replace(/\\\\/g, "\\")
              .replace(/\\u0026/g, "&");

            const channels = [];
            const seenUrls = new Set();
            let m3uContent = "#EXTM3U\n";

            // Find all m3u8 occurrences
            const streamMatches = [...cleanedData.matchAll(/(https?:[^\s"\\]+\.m3u8[^\s"\\]*)/gi)];

            for (const match of streamMatches) {
              const streamUrl = match[1];

              // Exclude duplicate stream links
              if (seenUrls.has(streamUrl)) continue;

              const startIndex = Math.max(0, match.index - 500);
              const endIndex = Math.min(cleanedData.length, match.index + 500);
              const context = cleanedData.substring(startIndex, endIndex);

              // Filtering JUNK/Category names and random hashes
              const junkNames = [
                "viewport", "description", "Noir", "Default", "NEXT_LOCALE", "G", "Ayna OTT",
                "Email", "Phone number", "Subscriber ID", "Home", "Live TV", "Drama", "Movies",
                "Series", "Privacy Policy", "Terms of Service", "About Us", "Contact Us", "FAQ", "News",
                "Bangla", "Channels", "Channel"
              ];

              let channelName = "";

              // Search for genuine title fields
              const titleMatch = context.match(/"(?:title|channelName|tvName)"\s*:\s*"([^"]+)"/i) ||
                                 context.match(/"name"\s*:\s*"([^"]+)"/i);

              if (titleMatch) {
                const foundName = titleMatch[1].trim();
                // Check if name is valid and not a random alphanumeric hash ID (e.g. EWDrV5Qskgar...)
                if (!junkNames.includes(foundName) && !/^[a-zA-Z0-9]{12,}$/.test(foundName)) {
                  channelName = foundName;
                }
              }

              // Fallback to URL-based Channel Name if API name was junk/hash
              if (!channelName) {
                channelName = deriveNameFromUrl(streamUrl);
              }

              if (!channelName) {
                channelName = `Channel ${channels.length + 1}`;
              }

              // Filter out bad generic logos
              let logoUrl = "";
              const logoMatch = context.match(/"(?:logo|poster|image|thumbnail)"\s*:\s*"([^"]+\.(?:png|jpg|jpeg|webp)[^"]*)"/i);
              
              if (logoMatch && !logoMatch[1].includes("generic") && !logoMatch[1].includes("default")) {
                logoUrl = logoMatch[1];
              }

              seenUrls.add(streamUrl);

              channels.push({
                name: channelName,
                logo: logoUrl,
                url: streamUrl
              });

              m3uContent += `#EXTINF:-1 tvg-name="${channelName}" tvg-logo="${logoUrl}", ${channelName}\n${streamUrl}\n`;
            }

            fs.writeFileSync("channels.json", JSON.stringify(channels, null, 2));
            fs.writeFileSync("playlist.m3u", m3uContent);
            console.log(`Generated ${channels.length} unique TV channels successfully.`);
          }

          processData();
          EOF
          node parse.js

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.json playlist.m3u
          git diff --staged --quiet || git commit -m "Filtered category names, junk hashes and updated channel list: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
