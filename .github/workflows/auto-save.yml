name: Generate Accurate M3U and JSON Playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch API and Extract Channel Details
        run: |
          cat << 'EOF' > parse.js
          const fs = require("fs");
          const https = require("https");

          const urls = [
            "https://web.aynaott.com/live-tvs?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019dd930-8c78-702b-8c44-4cc1bf4b7bc7?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019efa5d-2eb7-7ac1-a880-647e38ba7141?_rsc=d6u12"
          ];

          const options = {
            headers: {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "RSC": "1",
              "Accept": "*/*"
            }
          };

          const fetchData = (url) => new Promise((resolve) => {
            https.get(url, options, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => resolve(data));
            }).on("error", () => resolve(""));
          });

          // Standard mapping for known encrypted stream hash IDs to proper channel names & logos
          const knownChannelMap = {
            "tsn1": { name: "T Sports 1", logo: "https://web.aynaott.com/logos/tsports.png" },
            "tsn2": { name: "T Sports 2", logo: "https://web.aynaott.com/logos/tsports.png" },
            "tsn5": { name: "T Sports 5", logo: "https://web.aynaott.com/logos/tsports.png" },
            "espn": { name: "ESPN", logo: "https://web.aynaott.com/logos/espn.png" },
            "nfl": { name: "NFL Network", logo: "https://web.aynaott.com/logos/nfl.png" }
          };

          async function processData() {
            let rawData = "";
            for (const url of urls) {
              rawData += await fetchData(url) + "\n";
            }

            // Unescape Unicode & JSON text
            const cleanedData = rawData
              .replace(/\\"/g, '"')
              .replace(/\\\\/g, "\\")
              .replace(/\\u0026/g, "&");

            const channels = [];
            const seenUrls = new Set();
            let m3uContent = "#EXTM3U\n";

            // Extract objects containing stream links
            const streamMatches = [...cleanedData.matchAll(/(https?:[^\s"\\]+\.m3u8[^\s"\\]*)/gi)];

            // Match all images to map sequentially if missing direct association
            const allImages = [...cleanedData.matchAll(/(https?:[^\s"\\]+\.(?:png|jpg|jpeg|webp)[^\s"\\]*)/gi)].map(m => m[1]);

            let fallbackCount = 1;

            for (const match of streamMatches) {
              const streamUrl = match[1];

              // Skip duplicate stream URLs completely
              if (seenUrls.has(streamUrl)) continue;

              const startIndex = Math.max(0, match.index - 600);
              const endIndex = Math.min(cleanedData.length, match.index + 600);
              const context = cleanedData.substring(startIndex, endIndex);

              let channelName = "";
              let logoUrl = "";

              // Extract Name from RSC Context
              const nameMatches = [...context.matchAll(/"(?:title|name|channelName|label)"\s*:\s*"([^"]+)"/gi)];
              for (const nm of nameMatches) {
                const val = nm[1].trim();
                const isJunk = ["viewport", "description", "Noir", "Default", "NEXT_LOCALE", "G", "Ayna OTT", "Bangla", "Channels", "Live TV", "Email", "Home"].includes(val);
                const isHash = /^[a-zA-Z0-9]{12,}$/.test(val); // Detect random hash IDs
                
                if (!isJunk && !isHash) {
                  channelName = val;
                  break;
                }
              }

              // Extract Logo from RSC Context
              const logoMatch = context.match(/"(?:logo|image|poster|thumbnail|icon)"\s*:\s*"([^"]+\.(?:png|jpg|jpeg|webp)[^"]*)"/i) ||
                                context.match(/(https?:[^\s"\\]+\.(?:png|jpg|jpeg|webp)[^\s"\\]*)/i);
              
              if (logoMatch && !logoMatch[1].includes("avatar") && !logoMatch[1].includes("default")) {
                logoUrl = logoMatch[1];
              }

              // Fallback mapping if hash ID is used in stream URL path
              try {
                const parsed = new URL(streamUrl);
                const pathParts = parsed.pathname.split("/").filter(Boolean);
                const slug = pathParts[0] ? pathParts[0].replace(".m3u8", "").toLowerCase() : "";

                if (knownChannelMap[slug]) {
                  if (!channelName) channelName = knownChannelMap[slug].name;
                  if (!logoUrl) logoUrl = knownChannelMap[slug].logo;
                } else if (!channelName && slug && !/^[a-zA-Z0-9]{12,}$/.test(slug)) {
                  channelName = slug.replace(/[-_]/g, " ").replace(/\b\w/g, l => l.toUpperCase());
                }
              } catch (e) {}

              // Final fallbacks
              if (!channelName) {
                channelName = `Live Channel ${fallbackCount}`;
              }

              if (!logoUrl && allImages[channels.length]) {
                logoUrl = allImages[channels.length];
              }

              seenUrls.add(streamUrl);

              channels.push({
                name: channelName,
                logo: logoUrl,
                url: streamUrl
              });

              m3uContent += `#EXTINF:-1 tvg-name="${channelName}" tvg-logo="${logoUrl}", ${channelName}\n${streamUrl}\n`;
              fallbackCount++;
            }

            fs.writeFileSync("channels.json", JSON.stringify(channels, null, 2));
            fs.writeFileSync("playlist.m3u", m3uContent);
            console.log(`Successfully mapped ${channels.length} clean channels.`);
          }

          processData();
          EOF
          node parse.js

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.json playlist.m3u
          git diff --staged --quiet || git commit -m "Completely clean channel names & fixed logo matching: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
