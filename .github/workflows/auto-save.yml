name: Generate Accurate M3U and JSON Playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch API and Extract Channel Details
        run: |
          cat << 'EOF' > parse.js
          const fs = require("fs");
          const https = require("https");

          const urls = [
            "https://web.aynaott.com/live-tvs?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019dd930-8c78-702b-8c44-4cc1bf4b7bc7?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019efa5d-2eb7-7ac1-a880-647e38ba7141?_rsc=d6u12"
          ];

          const options = {
            headers: {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "RSC": "1",
              "Accept": "*/*"
            }
          };

          const fetchData = (url) => new Promise((resolve) => {
            https.get(url, options, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => resolve(data));
            }).on("error", () => resolve(""));
          });

          // Logo Mapping Logic
          const logoFallbackMap = {
            "btv": "https://web.aynaott.com/logos/btv.png",
            "btv national hd": "https://web.aynaott.com/logos/btv.png",
            "somoy tv": "https://web.aynaott.com/logos/somoy.png",
            "channel i": "https://web.aynaott.com/logos/channel-i.png",
            "ntv": "https://web.aynaott.com/logos/ntv.png",
            "bangla vision": "https://web.aynaott.com/logos/banglavision.png",
            "rtv": "https://web.aynaott.com/logos/rtv.png",
            "atn bangla": "https://web.aynaott.com/logos/atn-bangla.png",
            "etv": "https://web.aynaott.com/logos/etv.png",
            "maasranga tv": "https://web.aynaott.com/logos/maasranga.png",
            "deepto tv": "https://web.aynaott.com/logos/deepto.png",
            "ekhon tv": "https://web.aynaott.com/logos/ekhon.png",
            "ekattor tv": "https://web.aynaott.com/logos/ekattor.png",
            "jamuna tv": "https://web.aynaott.com/logos/jamuna.png",
            "news 24 bd": "https://web.aynaott.com/logos/news24.png",
            "channel 24": "https://web.aynaott.com/logos/channel24.png",
            "dbc news": "https://web.aynaott.com/logos/dbc.png",
            "atn news": "https://web.aynaott.com/logos/atn-news.png",
            "gazi tv": "https://web.aynaott.com/logos/gtv.png",
            "independent tv": "https://web.aynaott.com/logos/independent.png"
          };

          // Priority 1: Bangladeshi Channels (BTV First, Somoy TV & rest included)
          const bdChannelPriority = [
            "btv national hd", "btv", "btv world", "btv ctg", "somoy tv",
            "channel i", "ntv", "bangla vision", "rtv", "atn bangla", 
            "etv", "maasranga tv", "deepto tv", "ekhon tv", "ekattor tv", 
            "jamuna tv", "news 24 bd", "channel 24", "dbc news", "atn news", 
            "independent tv", "gazi tv", "channel 9", "sa tv", "bangla tv", 
            "mohona tv", "nexus tv", "bijoy tv", "global tv", "my tv", 
            "ananda tv", "desh tv", "boishakhi tv"
          ];

          // Priority 2: Sports Channels List
          const sportsKeywords = [
            "t sports", "tsn", "sports", "espn", "nfl", "bein", "cricket", "football", "willow", "ptv sports"
          ];

          async function processData() {
            let rawData = "";
            for (const url of urls) {
              rawData += await fetchData(url) + "\n";
            }

            const cleanedData = rawData
              .replace(/\\"/g, '"')
              .replace(/\\\\/g, "\\")
              .replace(/\\u0026/g, "&");

            let extractedChannels = [];
            const seenUrls = new Set();

            const rawBlocks = cleanedData.split(/(?=\{"id"|\{"title"|\{"name")/g);

            for (const block of rawBlocks) {
              if (!block.includes(".m3u8")) continue;

              const streamMatch = block.match(/(https?:[^\s"\\]+\.m3u8[^\s"\\]*)/i);
              if (!streamMatch) continue;

              const streamUrl = streamMatch[1];
              if (seenUrls.has(streamUrl)) continue;

              let title = "";
              const titleMatch = block.match(/"(?:title|name|channelName|tvName|label)"\s*:\s*"([^"]+)"/i);
              
              if (titleMatch) {
                const val = titleMatch[1].trim();
                const junk = ["viewport", "description", "Noir", "Default", "NEXT_LOCALE", "G", "Ayna OTT", "Bangla", "Channels"];
                if (!junk.includes(val) && !/^[a-zA-Z0-9]{12,}$/.test(val)) {
                  title = val;
                }
              }

              if (!title) continue;

              let logoUrl = "";
              const logoMatch = block.match(/"(?:logo|image|poster|thumbnail|icon|src)"\s*:\s*"([^"]+)"/i) ||
                                block.match(/(\/storage\/[^\s"\\]+\.(?:png|jpg|jpeg|webp))/i) ||
                                block.match(/(https?:[^\s"\\]+\.(?:png|jpg|jpeg|webp)[^\s"\\]*)/i);

              if (logoMatch) {
                let extracted = logoMatch[1].trim();
                if (extracted.startsWith("/")) {
                  extracted = "https://web.aynaott.com" + extracted;
                }
                if (!extracted.includes("avatar") && !extracted.includes("default")) {
                  logoUrl = extracted;
                }
              }

              const lowerTitle = title.toLowerCase();
              if (!logoUrl && logoFallbackMap[lowerTitle]) {
                logoUrl = logoFallbackMap[lowerTitle];
              }

              seenUrls.add(streamUrl);

              // Assign Group Category
              let category = "Others";
              const isBd = bdChannelPriority.some(item => lowerTitle.includes(item));
              const isSports = sportsKeywords.some(item => lowerTitle.includes(item));

              if (isBd) {
                category = "Bangladeshi";
              } else if (isSports) {
                category = "Sports";
              }

              extractedChannels.push({
                name: title,
                logo: logoUrl,
                url: streamUrl,
                category: category
              });
            }

            // Categorized Sorting Logic: BD -> Sports -> Others
            extractedChannels.sort((a, b) => {
              const nameA = a.name.toLowerCase();
              const nameB = b.name.toLowerCase();

              if (a.category === "Bangladeshi" && b.category !== "Bangladeshi") return -1;
              if (a.category !== "Bangladeshi" && b.category === "Bangladeshi") return 1;

              if (a.category === "Bangladeshi" && b.category === "Bangladeshi") {
                const indexA = bdChannelPriority.findIndex(item => nameA.includes(item));
                const indexB = bdChannelPriority.findIndex(item => nameB.includes(item));
                if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                if (indexA !== -1) return -1;
                if (indexB !== -1) return 1;
              }

              if (a.category === "Sports" && b.category !== "Sports") return -1;
              if (a.category !== "Sports" && b.category === "Sports") return 1;

              return nameA.localeCompare(nameB);
            });

            let m3uContent = "#EXTM3U\n";
            for (const ch of extractedChannels) {
              m3uContent += `#EXTINF:-1 group-title="${ch.category}" tvg-name="${ch.name}" tvg-logo="${ch.logo}", ${ch.name}\n${ch.url}\n`;
            }

            fs.writeFileSync("channels.json", JSON.stringify(extractedChannels, null, 2));
            fs.writeFileSync("playlist.m3u", m3uContent);
            console.log(`Successfully ordered playlist by categories (Bangladeshi -> Sports -> Others).`);
          }

          processData();
          EOF
          node parse.js

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.json playlist.m3u
          git diff --staged --quiet || git commit -m "Added Somoy TV and Categorized Playlist (Bangladeshi -> Sports -> Others): $(date +'%Y-%m-%d %H:%M:%S')"
          git push
