name: Auto Save JSON and M3U Playlist

on:
  schedule:
    # প্রতিদিন রাত ১২টায় স্বয়ংক্রিয়ভাবে আপডেট হবে
    - cron: '0 0 * * *'
  workflow_dispatch: # অপশনটি থাকলে আপনি ম্যানুয়ালি "Run workflow" বাটনে ক্লিক করেও আপডেট করতে পারবেন

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Fetch Script
        run: node update_channels.js

      - name: Commit and Push Updated JSON & M3U
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json playlist.m3u
          git commit -m "Auto update channels.json and playlist.m3u" || exit 0
          git push
