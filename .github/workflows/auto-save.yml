name: Generate Accurate M3U and JSON Playlist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch API and Extract Channel Details
        run: |
          cat << 'EOF' > parse.js
          const fs = require("fs");
          const https = require("https");

          // Ayna OTT Main & Block APIs to retrieve all channels
          const urls = [
            "https://web.aynaott.com/live-tvs?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019dd930-8c78-702b-8c44-4cc1bf4b7bc7?_rsc=d6u12",
            "https://web.aynaott.com/live-tvs/blocks/019efa5d-2eb7-7ac1-a880-647e38ba7141?_rsc=d6u12"
          ];

          const options = {
            headers: {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "RSC": "1",
              "Accept": "*/*"
            }
          };

          const fetchData = (url) => new Promise((resolve) => {
            https.get(url, options, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => resolve(data));
            }).on("error", () => resolve(""));
          });

          async function processData() {
            let rawData = "";
            for (const url of urls) {
              rawData += await fetchData(url) + "\n";
            }

            // Unescape quotes and slashes for parsing RSC payload
            const cleanedData = rawData.replace(/\\"/g, '"').replace(/\\\\/g, "\\");

            const channels = [];
            const seenUrls = new Set();
            let m3uContent = "#EXTM3U\n";

            // Regex pattern to extract JSON objects containing m3u8 streams
            const regex = /\{[^{}]*"(?:stream_url|streamUrl|url|link|src)"\s*:\s*"(https?:[^\s"\\]+\.m3u8[^\s"\\]*)"[^{}]*\}/gi;
            
            // Alternative match for whole object boundaries in RSC response
            const objectBlocks = cleanedData.match(/\{[^{}]*\}/g) || [];

            // Helper function to extract channel info from JSON string
            function extractInfo(str) {
              const urlMatch = str.match(/(https?:[^\s"\\]+\.m3u8[^\s"\\]*)/i);
              if (!urlMatch) return null;

              const streamUrl = urlMatch[1];

              // Title match priorities
              const titleMatch = str.match(/"(?:title|name|channelName|tvName|label)"\s*:\s*"([^"]+)"/i);
              const logoMatch = str.match(/"(?:logo|image|poster|thumbnail|icon)"\s*:\s*"([^"]+\.(?:png|jpg|jpeg|webp)[^"]*)"/i) ||
                                str.match(/(https?:[^\s"\\]+\.(?:png|jpg|jpeg|webp)[^\s"\\]*)/i);

              let title = titleMatch ? titleMatch[1].trim() : "";
              let logo = logoMatch ? logoMatch[1] : "";

              // Skip invalid site UI keywords
              const junkTitles = ["viewport", "description", "Noir", "Default", "NEXT_LOCALE", "G", "Ayna OTT"];
              if (junkTitles.includes(title)) title = "";

              return { title, logo, streamUrl };
            }

            for (const block of objectBlocks) {
              if (!block.includes(".m3u8")) continue;

              const item = extractInfo(block);
              if (!item || !item.streamUrl) continue;

              if (seenUrls.has(item.streamUrl)) continue;

              const finalTitle = item.title || `Channel ${channels.length + 1}`;
              const finalLogo = item.logo || "";

              seenUrls.add(item.streamUrl);
              channels.push({
                name: finalTitle,
                logo: finalLogo,
                url: item.streamUrl
              });

              m3uContent += `#EXTINF:-1 tvg-name="${finalTitle}" tvg-logo="${finalLogo}", ${finalTitle}\n${item.streamUrl}\n`;
            }

            // Global regex scan fallback for any missed streams with nearby titles/logos
            const allStreamMatches = [...cleanedData.matchAll(/(https?:[^\s"\\]+\.m3u8[^\s"\\]*)/gi)];
            for (const match of allStreamMatches) {
              const streamUrl = match[1];
              if (seenUrls.has(streamUrl)) continue;

              // Search surrounding 500 characters for metadata
              const startIndex = Math.max(0, match.index - 250);
              const endIndex = Math.min(cleanedData.length, match.index + 250);
              const context = cleanedData.substring(startIndex, endIndex);

              const titleMatch = context.match(/"(?:title|name|channelName)"\s*:\s*"([^"]+)"/i);
              const logoMatch = context.match(/(https?:[^\s"\\]+\.(?:png|jpg|jpeg|webp)[^\s"\\]*)/i);

              const title = titleMatch ? titleMatch[1].trim() : `Channel ${channels.length + 1}`;
              const logo = logoMatch ? logoMatch[1] : "";

              seenUrls.add(streamUrl);
              channels.push({
                name: title,
                logo: logo,
                url: streamUrl
              });

              m3uContent += `#EXTINF:-1 tvg-name="${title}" tvg-logo="${logo}", ${title}\n${streamUrl}\n`;
            }

            fs.writeFileSync("channels.json", JSON.stringify(channels, null, 2));
            fs.writeFileSync("playlist.m3u", m3uContent);
            console.log(`Total Unique Channels Generated: ${channels.length}`);
          }

          processData();
          EOF
          node parse.js

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.json playlist.m3u
          git diff --staged --quiet || git commit -m "Updated all channels with accurate titles and logos: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
