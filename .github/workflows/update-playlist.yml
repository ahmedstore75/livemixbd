name: Auto Update IPTV Playlists

on:
  schedule:
    # প্রতিদিন রাত ১২টায় (UTC 00:00) অটোমেটিক রান হবে
    - cron: '0 0 * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install axios

      - name: Run index.js to Generate Playlists
        run: node index.js

      - name: Commit and Push Updated Playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add circle.m3u circle.json
          git commit -m "Auto update circle.m3u and circle.json" || exit 0
          git push
