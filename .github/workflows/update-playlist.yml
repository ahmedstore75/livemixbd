name: Auto Update IPTV Playlists

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Curl-Impersonate
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar
          wget https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz
          mkdir -p curl-temp
          tar -xvf curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz -C curl-temp
          sudo cp curl-temp/curl_chrome110 /usr/local/bin/curl-impersonate-chrome
          sudo chmod +x /usr/local/bin/curl-impersonate-chrome

      - name: Run index.js to Generate Playlists
        run: node index.js

      - name: Commit and Push Updated Playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]"
          git add .
          git commit -m "Auto update circle playlists" || exit 0
          git push
