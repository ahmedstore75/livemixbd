name: Auto Update Playlist

on:
  schedule:
    - cron: '*/5 * * * *' # প্রতি ৫ মিনিট পর পর রান হবে
  repository_dispatch:
    types: [update_json]
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fetch Script
        run: node fetch_to_json.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git status
          git diff --staged --quiet || (git commit -m "Auto updated playlist.json at $(date -u)" && git push)
