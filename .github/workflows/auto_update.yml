name: Auto Update M3U to JSON

on:
  schedule:
    - cron: '0 * * * *' # প্রতি ১ ঘণ্টা পর পর রান হবে
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # প্রয়োজন হলে নিচে কমেন্ট আউট তুলে দিন
      # - name: Install dependencies
      #   run: npm install

      - name: Run Script
        run: node fetch_to_json.js

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Auto updated playlist.json [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
